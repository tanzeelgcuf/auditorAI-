# AI Auditor v1 — CI Pipeline
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.22"
  RUST_VERSION: "1.77"

jobs:
  go:
    name: Go (services/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_auditor_test
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Run sqlc
        working-directory: services/api
        run: sqlc compile
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/api
      - name: Test
        working-directory: services/api
        env:
          DATABASE_URL: postgres://auditor:testpass@localhost:5432/ai_auditor_test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/api/coverage.out
          flags: go

  rust-ingestion:
    name: Rust (services/ingestion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Check format
        working-directory: services/ingestion
        run: cargo fmt --check
      - name: Clippy
        working-directory: services/ingestion
        run: cargo clippy -- -D warnings
      - name: Test
        working-directory: services/ingestion
        run: cargo test --all-targets --all-features
      - name: Build release
        working-directory: services/ingestion
        run: cargo build --release

  rust-verification:
    name: Rust (services/verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Check format
        working-directory: services/verification
        run: cargo fmt --check
      - name: Clippy
        working-directory: services/verification
        run: cargo clippy -- -D warnings
      - name: Test
        working-directory: services/verification
        run: cargo test --all-targets --all-features
      - name: Build release
        working-directory: services/verification
        run: cargo build --release

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build

  security:
    name: Security & License Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          audit_on: push
          publish_token: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            ./

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API
        run: docker build -t ai-auditor-api:ci ./services/api
      - name: Build Verification
        run: docker build -t ai-auditor-verification:ci ./services/verification
      - name: Build Ingestion
        run: docker build -t ai-auditor-ingestion:ci ./services/ingestion
      - name: Build OCR Sidecar
        run: docker build -t ai-auditor-ocr:ci ./services/ingestion/ocr-sidecar