# AI Auditor v1 — CI Pipeline
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # GO_VERSION was "1.22" while services/api/go.mod declares `go 1.25.0`. Rather
  # than keeping two numbers in sync, the Go job now reads go.mod directly
  # (go-version-file), so the toolchain can never drift behind the module again.
  #
  # RUST_VERSION was "1.77". Cargo.lock resolves sentry 0.49.1, whose MSRV is
  # above that. `stable` is used because the true minimum could not be
  # established without compiling; pin an exact version once one is confirmed
  # green. Cargo.lock — not this value — is what pins dependency versions.
  RUST_VERSION: stable

jobs:
  go:
    name: Go (services/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_auditor_test
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      # A `services:` container starts EMPTY. internal/middleware/security_test.go:3
      # requires "a REAL Postgres with the infra/init.sql schema and RLS policies
      # applied" — without this step the suite has no tables to query.
      #
      # TWO files, in this order. infra/00-bootstrap-roles.sql CREATEs auditor_app
      # and auditor_sys; infra/init.sql GRANTs to them and RAISEs at the end if
      # either is missing, so reversing the order fails the load. They were one
      # file until 2026-09-06, when the psql \getenv meta-commands in the bootstrap
      # turned out to be what broke `sqlc compile` below — see that file's header.
      #
      # APP_DB_PASSWORD / SYS_DB_PASSWORD are NOT optional. The bootstrap reads
      # them with \getenv and RAISEs when either is unset, shorter than 16 chars,
      # or equal to the other — so with only PGPASSWORD set this step aborts before
      # creating a single table. These are throwaway CI credentials for an ephemeral
      # container; they are deliberately literal here so the job does not depend on
      # repository secrets being configured.
      - name: Load schema
        env:
          PGPASSWORD: testpass
          APP_DB_PASSWORD: ci_app_password_not_secret
          SYS_DB_PASSWORD: ci_sys_password_not_secret
        run: |
          psql -h localhost -U auditor -d ai_auditor_test -v ON_ERROR_STOP=1 \
            -f infra/00-bootstrap-roles.sql
          psql -h localhost -U auditor -d ai_auditor_test -v ON_ERROR_STOP=1 \
            -f infra/init.sql

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Run sqlc
        working-directory: services/api
        run: sqlc compile
      # Config: services/api/.golangci.yml (added 2026-09-04 — there was none, so
      # this step ran on golangci-lint defaults and reported every unchecked
      # json.NewEncoder(w).Encode in the service).
      #
      # Version pinned rather than `latest`. `latest` means a new golangci-lint
      # release can turn this job red with no change to this repository, and the
      # project's own guidance is to fix the minor version because any minor update
      # may report more findings than the previous one. v2.12 is the current v2 line
      # as far as could be established from outside; if the install step 404s, bump
      # this — do not put `latest` back.
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v2.12
          working-directory: services/api

      # Four DSNs, and the split between them is the test contract:
      #
      #   DATABASE_URL            what cmd/server calls the app pool -> auditor_app
      #                           (NOSUPERUSER, NOBYPASSRLS, non-owner). RLS lives.
      #   SYS_DATABASE_URL        main.go:97 -> auditor_sys (BYPASSRLS). Pre-auth
      #                           identity lookups and cross-firm workers.
      #   DATABASE_URL_TEST       the pool every assertion in security_test.go runs
      #                           against. Previously the `auditor` superuser, which
      #                           made the whole isolation suite vacuous.
      #   DATABASE_URL_TEST_OWNER fixtures + cross-tenant verification reads. Must be
      #                           the OWNER, because init.sql grants DML only and
      #                           setupEnv TRUNCATEs.
      #
      # assertPoolsDiffer (security_test.go:117) fails the suite if these last two
      # resolve to the same enforcement posture, so a future "simplification" back
      # to one DSN goes red instead of quietly passing.
      - name: Test
        working-directory: services/api
        env:
          DATABASE_URL: postgres://auditor_app:ci_app_password_not_secret@localhost:5432/ai_auditor_test
          SYS_DATABASE_URL: postgres://auditor_sys:ci_sys_password_not_secret@localhost:5432/ai_auditor_test
          DATABASE_URL_TEST: postgres://auditor_app:ci_app_password_not_secret@localhost:5432/ai_auditor_test
          DATABASE_URL_TEST_OWNER: postgres://auditor:testpass@localhost:5432/ai_auditor_test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/api/coverage.out
          flags: go

  rust-ingestion:
    name: Rust (services/ingestion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # protoc was absent, so build.rs -> tonic_build::compile_protos could not
      # run: prost-build 0.11+ dropped the vendored protoc and requires it on
      # PATH. This job could not have been passing.
      #
      # cmake is needed by aws-lc-sys 0.43.0 (aws-sdk-s3 -> aws-lc-rs). It is
      # preinstalled on ubuntu-latest; installed explicitly so the job does not
      # depend on the runner image's inventory.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler cmake pkg-config libssl-dev
          protoc --version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Check format
        working-directory: services/ingestion
        run: cargo fmt --check
      - name: Clippy
        working-directory: services/ingestion
        run: cargo clippy --all-targets -- -D warnings
      # NOT --all-features. The `enhance` feature gates deliberately-inert
      # preprocessing stages (Cargo.toml:37-40) and the shipped image does not
      # enable it, so testing with it enabled tests code that never runs in
      # production while leaving the shipped path less covered.
      - name: Test
        working-directory: services/ingestion
        run: cargo test --all-targets
      - name: Build release
        working-directory: services/ingestion
        run: cargo build --release --locked

  rust-verification:
    name: Rust (services/verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No cmake here: verification's Cargo.lock has no aws-lc-sys. protoc is
      # still mandatory (tonic-build 0.10), and openssl-sys 0.9.117 arrives via
      # sentry's default transport.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler pkg-config libssl-dev
          protoc --version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Check format
        working-directory: services/verification
        run: cargo fmt --check
      - name: Clippy
        working-directory: services/verification
        run: cargo clippy --all-targets -- -D warnings
      # This is the liability-critical crate: every money calculation in the
      # product happens here, in rust_decimal. proptest is a dev-dependency, so
      # the property tests over decimal math run as part of this step.
      - name: Test
        working-directory: services/verification
        run: cargo test --all-targets
      - name: Build release
        working-directory: services/verification
        run: cargo build --release --locked

  # Static guards. No database, no toolchain beyond python3 — these check
  # invariants that the language-specific jobs above structurally cannot see,
  # because each of them proves something about code that no test executes.
  #
  # The job id and display name are deliberately NOT renamed now that it hosts
  # more than the schema check: GitHub branch protection keys required checks on
  # the display name ("Schema Drift Guard"), so renaming silently drops the
  # requirement instead of updating it.
  schema-drift:
    name: Schema Drift Guard

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Static, no database: parses CREATE TABLE / CREATE VIEW out of
      # infra/init.sql, then every SQL string literal in services/api and
      # services/agent-runtime, and fails when code references a relation or
      # column the schema does not define.
      #
      # This exists because db/migrations/ had drifted from infra/init.sql — only
      # init.sql was ever applied, so 6 relations and 10 columns that live code
      # queried did not exist in the deployed database. Those are 500s at runtime
      # that no other job in this file could see: `sqlc compile` checks the
      # queries sqlc owns, and the Go tests skip when they cannot reach Postgres.
      #
      # Verified in both directions before being added here: it reports OK on the
      # current tree, and reports the missing relation and the missing column when
      # a probe file referencing each is dropped into internal/tenant.
      - name: Check schema drift
        run: python3 scripts/check_schema_drift.py --verbose

      # Orphan storage keys. internal/documents.HandleUpload used to generate a
      # storage_key, write the source_documents row and publish document.uploaded
      # WITHOUT ever writing the bytes — the upload answered 201, the coordinator
      # got NoSuchKey from StreamObject, acked the message, and the document sat
      # at ocr_status='pending' forever. No test could see it: none of them reach
      # object storage. This guard asserts the invariant structurally instead —
      # a file that writes a storage_key must also write the bytes (PutObject) or
      # verify they landed (ObjectExists), or be allowlisted with a reason.
      #
      # Verified in both directions before being added here: exit 0 on the current
      # tree ("4 file(s) write a storage_key; 2 allowlisted, 0 unaccounted for"),
      # exit 1 naming documents.go when the original bug is reintroduced, and exit
      # 1 with an explicit "this guard is inert" message if its SQL pattern ever
      # stops matching the codebase.
      - name: Check for orphan storage keys
        run: python3 scripts/check_storage_key_orphans.py --verbose

      # Cancellable audit writes. `r.Context()` dies when the client's socket
      # closes, so a database write on it whose error is swallowed into a log
      # line can be deleted by the party it records — they hang up, the row is
      # never written, and the action itself stands because it already committed.
      # Four instances found: middleware.ReleaseRLSConn (tenant GUCs surviving
      # into the next request on a pooled connection), auth.persistLoginFailure
      # (the failed-login increment that IS the per-account lockout ceiling),
      # middleware.RecordAccess (all 12 access_log call sites) and
      # humanoverride.LogConfigChange (config_change_log). Three of the four were
      # pre-existing, which is why this is a standing guard and not a one-off fix.
      #
      # The guard has two halves, and the positive one is the half that survives
      # a refactor: it asserts those four sites still carry
      # context.WithoutCancel, so reverting one fails by name even if the search
      # patterns stop matching. Verified in four directions before being added
      # here: exit 0 on the current tree ("all 4 known fixes in place"); exit 1
      # naming ONLY RecordAccess when its strip is removed; exit 1 naming ONLY a
      # newly planted handler that writes access_log on r.Context() and logs the
      # error; exit 1 with an explicit "this guard is inert" message when pointed
      # at a tree the patterns do not match.
      - name: Check for cancellable audit writes
        run: python3 scripts/check_cancellable_audit_writes.py --verbose

      # Audit source IP. access_log could not answer "from where" until
      # 2026-09-05; source_ip INET was added to all three audit tables
      # (access_log, config_change_log, period_reopen_log). Everything about that
      # change fails silently if it drifts, which is why it is guarded:
      #
      #   * pgx binds AND scans BY POSITION. A column added without its argument
      #     errors at runtime and RecordAccess/LogConfigChange swallow the error
      #     into slog.Warn, so the audit row just disappears. The SAME count in
      #     the wrong order raises nothing at all and writes a confidently wrong
      #     row, which for an audit product is worse than an empty one.
      #   * HandleConfigHistory `continue`s on a Scan error inside for rows.Next(),
      #     so a select list one longer than its Scan list returns {"items": []}
      #     for every book, with a 200.
      #   * middleware.SourceIP must stay BELOW middleware.RealIP in the root
      #     chain. Above it, it copies the untouched RemoteAddr and records the
      #     PROXY's address on every request behind a proxy — no error, no log
      #     line, a permanently wrong audit trail. Source order, so no unit test
      #     on either function can see it.
      #   * LogConfigChange wrote on the RAW app pool until 2026-09-05.
      #     config_change_log has FORCE RLS and its policy reads
      #     current_setting('app.assigned_books') with no missing_ok and no
      #     database/role default exists, so the INSERT could only fail — and did
      #     so into a slog.Warn. That table had almost certainly never received a
      #     row. Pinned by name so the raw-pool form cannot come back.
      #
      # 11 plausible mutants were run against this guard before it was added
      # here, each caught by its own invariant, including "the guard parsed zero
      # r.Use() entries" failing rather than passing.
      - name: Check audit source-IP wiring
        run: python3 scripts/check_audit_ip_arity.py --verbose

      # RLS write priming. Every statement against an RLS table must run on a
      # connection RLSInjector or AcquireScoped primed with app.current_firm and
      # app.assigned_books. The failure mode is NOT the intuitive one: init.sql's
      # policies call current_setting(...) with no missing_ok and cast the result
      # straight to uuid / uuid[] (33 of the 35 calls in the schema; the only
      # 2-argument ones are the bootstrap password lookups), so an unprimed
      # statement RAISES — 42704 undefined_object when the GUC was never set on
      # that physical connection, 22P02 invalid_text_representation on ''::uuid
      # once ReleaseRLSConn has RESET it. It does not filter, and it does not
      # return zero rows. Earlier comments in this repo claimed the zero-rows
      # outcome; they were wrong and were corrected, not left standing.
      #
      # THE SHAPE THAT HID IT, in eleven places across seven files:
      #
      #     c := middleware.GetConn(ctx)
      #     if c == nil { c, _ = s.db.Acquire(ctx) }   // looks handled
      #
      # Acquire() succeeds, so the branch reads as defensive while handing back
      # the exact value the nil check existed to reject. Fabricating a substitute
      # for a value you could not resolve is worse than failing, because the
      # failure moves somewhere that cannot explain it.
      #
      # THREE HALVES, because each one has a blind spot the others cover:
      #   * negative — resolves the receiver of every .Exec/.Query/.QueryRow/
      #     .Begin whose SQL touches an RLS table, and fails on a bare pool not
      #     in ALLOWLIST. Keyed per-RECEIVER, not per-file: billing.go holds both
      #     s.sysDB (BYPASSRLS, correct) and s.db (app pool), so a file-level
      #     excusal would hide exactly the writes this guard exists to catch.
      #   * positive — pins all 8 fixed sites by name, so reverting one fails even
      #     if the search patterns stop matching.
      #   * fabrication — flags `<pool>.Acquire(` by shape. This half was added
      #     after mutant M1 showed the negative half could not see a reverted
      #     fix: the enclosing function still contains middleware.GetConn(, so
      #     the receiver still classified as primed. Within minutes of being
      #     added it found FIVE unflagged instances (mcp.go x4, review.go x1) on
      #     the RLS-enforced app pool, in files three prior sweeps of this same
      #     bug class had passed over. Its verdict on those files was identical
      #     before and after the fix, which is the direct evidence that receiver
      #     classification alone is not enough.
      #
      # Zero matches must FAIL, never quietly succeed: fewer than 20 RLS tables,
      # fewer than 40 matched statements, no primed receiver at all, or zero
      # .Acquire( calls all exit 2 rather than printing OK.
      #
      # 9 mutants + 2 inertness breakages were run before this was added here,
      # each from a pristine copy so no result is contaminated by the previous
      # mutation, and each required to name ITS OWN site and no other pinned file
      # — including one brand-new fabrication planted in findings.go, a file with
      # no pin, which the positive half cannot possibly catch. Reproduce with:
      #     python3 scripts/mutate_rls_guard.py
      - name: Check RLS write priming
        run: python3 scripts/check_rls_write_priming.py --verbose

      # psql/SQL split between infra/init.sql and infra/00-bootstrap-roles.sql.
      # services/api/sqlc.yaml sets `schema: "../../infra/init.sql"`, so sqlc
      # parses that file with the real PostgreSQL parser. init.sql contained four
      # psql CLIENT meta-commands (\set x2, \getenv x2) and a psql variable
      # interpolation (:'app_pw'), none of which is SQL. `sqlc compile` failed,
      # and because that step precedes `go test` in the Go job, EVERY Go test —
      # the entire DATABASE_URL_TEST integration suite included — never ran. That
      # is why Phase 3's DB-backed cases had never had a first run.
      #
      # The reported position, 859:48, reads like a stray colon and is not one:
      # 859 was the first `\set` (14 chars, so it has no column 48) and 48 is the
      # column of :'app_pw' on line 863, the first statement-terminating `;`
      # after it. "Fixing the colon" would have broken database init and left
      # sqlc just as broken.
      #
      # The guard checks BOTH directions, because \getenv is a security control
      # rather than a style choice: the alternative form
      # `\set app_pw `printf '%s' "$APP_DB_PASSWORD"`` makes psql run a SHELL,
      # and inside double quotes a shell still expands $(...) and backticks, so a
      # password containing either would be EXECUTED during database init. A
      # guard that only rejected meta-commands in init.sql would be perfectly
      # happy if someone "simplified" the bootstrap back to the shell form.
      #
      # 9 mutants were run from pristine copies. Two findings worth keeping:
      # M1 was NOT caught at first — init.sql did not end in a newline, so an
      # appended `\set x 1` landed as `$selfcheck$;\set x 1`, which does not
      # START with a backslash. That was a bad mutant AND a real hole (psql
      # accepts a meta-command after a `;` on the same line); both are fixed, and
      # `E'\\d+'` is still correctly not flagged. M8, removing the `schema:` key
      # from sqlc.yaml, exits 2 INERT rather than printing OK.
      - name: Check bootstrap/schema split (sqlc-parseable init.sql)
        run: python3 scripts/check_bootstrap_split.py

  # services/agent-runtime has eight test modules under tests/ (88 tests as of
  # 2026-09-06) and requirements.txt already pins pytest and pytest-asyncio —
  # but nothing in CI ran them, so the Python service was the only one of the
  # four with zero automated coverage on every push. `pytest tests -q` collects
  # the directory, so a new tests/test_*.py needs no change here.
  python:
    name: Python (services/agent-runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches services/agent-runtime/Dockerfile (python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent-runtime/requirements.txt
      - name: Install dependencies
        working-directory: services/agent-runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Imports are checked separately from tests because main.py's import chain
      # is where a missing runtime dependency shows up: main.py imports
      # ollama_adapter, which imports `openai`. That package was absent from
      # requirements.txt, so the built container died on startup while every
      # test still passed (the tests never import ollama_adapter).
      - name: Import check (entrypoint chain)
        working-directory: services/agent-runtime
        run: python -c "import ollama_adapter, mcp_client, graph.graph_def; print('entrypoint imports OK')"
      # Cross-language money-parser parity. services/ingestion (Rust) owns
      # parse_amount; services/agent-runtime/harness_amount_mirror.py mirrors it
      # for the offline harnesses. When those two last disagreed, "1250" meant
      # $12.50 in Python and $1,250.00 in Rust and both suites were green, so
      # green suites alone do not catch this class — the tables must be compared.
      # Verified in both directions: 41/41 on the current tree, and it reports
      # `'100' rust=10000 python=0` when the bare-integer bug is reintroduced.
      - name: Check money-parser parity (Rust table vs Python mirror)
        run: python3 scripts/check_amount_parity.py
      - name: Test
        working-directory: services/agent-runtime
        env:
          PYTHONPATH: .
        run: pytest tests -q

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      # next.config.mjs now sets output:'standalone', so this also proves the
      # artifact apps/web/Dockerfile copies actually gets produced.
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Assert standalone output exists
        working-directory: apps/web
        run: test -f .next/standalone/server.js && test -d .next/static

  security:
    name: Security & License Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          audit_on: push
          publish_token: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            ./

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # EVERY COMMAND IN THIS JOB CHANGED. It previously ran
      # `docker build ./services/api` etc., i.e. per-service contexts with no
      # -f. Three problems, all fatal:
      #   1. No Dockerfile existed at any of those paths until this commit.
      #   2. services/{ingestion,verification}/build.rs reads
      #      ../../proto/<svc>.proto, which is outside a per-service context.
      #   3. apps/web and services/agent-runtime were never built at all, so the
      #      two images most likely to break went unchecked.
      #
      # The context/-f split mirrors infra/docker-compose.yml exactly; if these
      # two ever disagree, CI is testing something the deploy does not do.
      - name: Build API
        run: docker build -f services/api/Dockerfile -t ai-auditor-api:ci .
      - name: Build Ingestion
        run: docker build -f services/ingestion/Dockerfile -t ai-auditor-ingestion:ci .
      - name: Build Verification
        run: docker build -f services/verification/Dockerfile -t ai-auditor-verification:ci .
      - name: Build Web
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 \
            -t ai-auditor-web:ci .
      # These two keep their own contexts: their Dockerfiles use
      # context-relative COPY and predate this commit.
      - name: Build Agent Runtime
        run: docker build -t ai-auditor-agent-runtime:ci ./services/agent-runtime
      - name: Build OCR Sidecar
        run: docker build -t ai-auditor-ocr:ci ./services/ingestion/ocr-sidecar

      # Cheap end-to-end assertions on the produced images. Each one guards a
      # specific failure this repo has already demonstrated it can ship:
      # a missing external binary that the Go service only degrades on, and a
      # Rust binary that a stale cargo fingerprint left as an empty placeholder.
      - name: Assert image contents
        run: |
          docker run --rm --entrypoint sh ai-auditor-api:ci -c 'command -v clamdscan && command -v typst && command -v api'
          docker run --rm --entrypoint sh ai-auditor-verification:ci -c 'test -f /app/decision-graphs/gl_reconciliation.json'
          docker run --rm --entrypoint sh ai-auditor-web:ci -c 'test -f /app/server.js'

      # Compose only validates if every path, context and ${VAR} resolves. This
      # is the check that would have caught `context: ./services/api` resolving
      # to infra/services/api.
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml --env-file .env config -q
          docker compose -f infra/docker-compose.dev.yml config -q
