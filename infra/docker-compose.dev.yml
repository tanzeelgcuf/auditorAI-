# AI Auditor v1 — docker-compose.dev.yml (local development)
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# BACKING SERVICES ONLY. api / ingestion / verification / agent-runtime / web are
# meant to run on the host against these, which is why every port is published
# and the credentials are hardcoded dev values rather than ${VAR} lookups.
#
# Relative paths resolve against infra/ (the directory of the -f file), not the
# repo root — `./infra/init.sql` and `./services/...` were both wrong here.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_auditor
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: devpassword
      # init.sql reads these with \getenv to CREATE ROLE auditor_app/auditor_sys
      # and aborts if either is absent, under 16 chars, or equal to the other.
      # Hardcoded here because this file is local-dev-only; production values live
      # in .env (see .env.example).
      #
      # A HOST-RUN api must use them too, or RLS is inert exactly as before:
      #   DATABASE_URL=postgres://auditor_app:dev_app_password_1@localhost:5432/ai_auditor
      #   SYS_DATABASE_URL=postgres://auditor_sys:dev_sys_password_1@localhost:5432/ai_auditor
      # Connecting as `auditor` still works and still bypasses every policy — it
      # is the bootstrap superuser. main.go's boot check refuses to start on it.
      APP_DB_PASSWORD: dev_app_password_1
      SYS_DB_PASSWORD: dev_sys_password_1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # was ./infra/init.sql -> infra/infra/init.sql, which does not exist.
      # Compose would have created a DIRECTORY at that path and mounted it,
      # so postgres started with no schema at all.
      #
      # TWO files since 2026-09-06, and the order is load-bearing: the entrypoint
      # globs this directory lexically, so `00-` runs first, which is required
      # because init.sql GRANTs to roles the bootstrap creates. The bootstrap is
      # separate because its psql \getenv meta-commands are not SQL and sqlc
      # parses init.sql as its schema. Do not rename it to sort after init.sql.
      - ./00-bootstrap-roles.sql:/docker-entrypoint-initdb.d/00-bootstrap-roles.sql:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d ai_auditor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pgbouncer removed — see the long note in docker-compose.yml. Short version:
  # transaction pooling silently breaks the session-scoped app.current_firm the
  # RLS middleware sets, and the pooler's own DSN would have laundered every
  # connection into the `auditor` superuser, which is exempt from RLS. Connect to
  # postgres:5432 / localhost:5432 directly.

  nats:
    image: nats:2.10-alpine
    # -m 8222 starts the monitoring server. Port 8222 was already published but
    # nothing listened on it without this flag.
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  ocr-sidecar:
    build:
      # was `context: ./services/ingestion/ocr-sidecar` (-> infra/services/...)
      # with `dockerfile: Dockerfile.dev`, A FILE THAT DOES NOT EXIST in this
      # repo. Both errors meant this file could never build either.
      context: ../services/ingestion/ocr-sidecar
      dockerfile: Dockerfile
    environment:
      DOCTR_DEVICE: cpu
    ports:
      - "8000:8000"

  # Needed even for host-run development: internal/documents/clamav.go fails
  # CLOSED, so with no reachable clamd every upload is rejected.
  #
  # A host-run api does NOT get the container entrypoint that renders
  # clamd.conf, so point the host's /etc/clamav/clamd.conf at this daemon:
  #     TCPSocket 3310
  #     TCPAddr 127.0.0.1
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "3310:3310"

  langfuse:
    image: langfuse/langfuse:2
    environment:
      # Own database (init.sql creates it). Was ai_auditor, which meant langfuse's
      # Prisma migrations landed in the application schema.
      DATABASE_URL: postgres://auditor:devpassword@postgres:5432/langfuse
      NEXTAUTH_SECRET: devsecret
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: langfuse
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  glitchtip:
    image: glitchtip/glitchtip:latest
    environment:
      # Own database (init.sql creates it); Django `migrate` runs on every start.
      DATABASE_URL: postgres://auditor:devpassword@postgres:5432/glitchtip
      SECRET_KEY: devsecret
      ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  clamav_data: