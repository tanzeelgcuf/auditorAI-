# AI Auditor v1 — docker-compose.dev.yml (local development)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_auditor
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d ai_auditor"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://auditor:devpassword@postgres:5432/ai_auditor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  ocr-sidecar:
    build:
      context: ./services/ingestion/ocr-sidecar
      dockerfile: Dockerfile.dev
    environment:
      DOCTR_DEVICE: cpu
    ports:
      - "8000:8000"

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgres://auditor:devpassword@postgres:5432/ai_auditor
      NEXTAUTH_SECRET: devsecret
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: langfuse
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  glitchtip:
    image: glitchtip/glitchtip:latest
    environment:
      DATABASE_URL: postgres://auditor:devpassword@postgres:5432/ai_auditor
      SECRET_KEY: devsecret
      ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  postgres_data:
  qdrant_data:
  minio_data: