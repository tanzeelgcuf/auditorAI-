# AI Auditor v1 — docker-compose.yml (v1 production deploy target)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_auditor
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d ai_auditor"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - auditor

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://auditor:${POSTGRES_PASSWORD}@postgres:5432/ai_auditor
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    networks:
      - auditor

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://auditor:${POSTGRES_PASSWORD}@pgbouncer:6432/ai_auditor
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NATS_URL: nats://nats:4222
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      INGESTION_GRPC_ADDR: ingestion:50051
      VERIFICATION_GRPC_ADDR: verification:50052
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
      ingestion:
        condition: service_started
      verification:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - auditor

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    environment:
      OCR_SIDECAR_URL: http://ocr-sidecar:8000
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NATS_URL: nats://nats:4222
    depends_on:
      ocr-sidecar:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      - auditor

  ocr-sidecar:
    build:
      context: ./services/ingestion/ocr-sidecar
      dockerfile: Dockerfile
    environment:
      DOCTR_DEVICE: cpu
    networks:
      - auditor

  verification:
    build:
      context: ./services/verification
      dockerfile: Dockerfile
    environment:
      ZEN_DECISION_GRAPH_PATH: /app/services/verification/decision-graphs/gl_reconciliation.json
    networks:
      - auditor

  agent-runtime:
    build:
      context: ./services/agent-runtime
      dockerfile: Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_MCP_URL: http://api:8080/mcp
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - api
      - qdrant
    networks:
      - auditor

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - auditor

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    healthcheck:
      test: ["CMD", "nats", "server", "check", "jetstream"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auditor

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - auditor

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgres://auditor:${POSTGRES_PASSWORD}@pgbouncer:6432/ai_auditor
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      pgbouncer:
        condition: service_started
    ports:
      - "3001:3000"
    networks:
      - auditor

  glitchtip:
    image: glitchtip/glitchtip:latest
    environment:
      DATABASE_URL: postgres://auditor:${POSTGRES_PASSWORD}@pgbouncer:6432/ai_auditor
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      ALLOWED_HOSTS: "*"
    depends_on:
      pgbouncer:
        condition: service_started
    ports:
      - "8001:8000"
    networks:
      - auditor

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - auditor

  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - auditor

volumes:
  postgres_data:
  qdrant_data:
  letsencrypt:

networks:
  auditor:
    driver: bridge